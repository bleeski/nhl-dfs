[pytest]
timeout = 120
addopts = --strict-markers
markers =
    c0a: chunk C0a - repo scaffold, contracts, exact scoring, tracker tooling
    c0b: chunk C0b - intake, byte-splicing export, independent referee
    c1: chunk C1 - adapters, cache, observations, prospective capture
    c2a: chunk C2a - priors, feasibility fallback, HiGHS candidate builder
    c2b: chunk C2b - local-first baseline run, atomic publish, manifest, CLI
    c2c: chunk C2c - four-state lock model, late swap, refresh
    c3: chunk C3 - ownership prior, field sampler, duplicate proxy, evidence gates
    c4: chunk C4 - history cache, identity crosswalk, as-of features
    c5: chunk C5 - opportunity, event-rate, and goalie models
    c6: chunk C6 - aggregate joint simulator, market fit, scoring arrays
    c7: chunk C7 - roles and news, deterministic
    c8: chunk C8 - scenario objectives, frontier, allocation, full run
    c9: chunk C9 - objective-aware refresh and late swap
    c10: chunk C10 - Claude Code layer, agents, controller, rehearsal
    c11: chunk C11 - settle, financial ledger, grading, run notes, gate reports
    c12: chunk C12 - field-model fit by contest family
    c13: chunk C13 - segment simulator challenger
    c14: chunk C14 - lock-safe publishing (band 0)
    c15: chunk C15 - started slates (band 0)
    c16: chunk C16 - template payout curves
    c17: chunk C17 - inputs reach the models (field features, team rates, clip)
    c18: chunk C18 - joint own-entry accounting
    c19: chunk C19 - field stack mix by slate size
    c46: chunk C46 - field 5+ stacks, the team5 rule
    c20: chunk C20 - goalie as the top-1% factor
    c21: chunk C21 - stack size by slate blow-up (experiment)
    c22: chunk C22 - chalk core and depth leverage (experiment)
    c23: chunk C23 - Showdown Captain choice (experiment)
    c24: chunk C24 - DTD participation in the simulator
    c25: chunk C25 - clean calibration and tail preregistration
    c26: chunk C26 - controller safety
    c27: chunk C27 - portfolio caps
    c28: chunk C28 - role state in Phase A and simulate
    c29: chunk C29 - settle without a run, stable slate groups
    c30: chunk C30 - standings tooling
    c31: chunk C31 - QA throughput and provenance
    c32: chunk C32 - hygiene
    c33: chunk C33 - referee raw-byte check
    c34: chunk C34 - repair draws
    c35: chunk C35 - field sampler agreement and SE
    c36: chunk C36 - odds history grading
    c37: chunk C37 - delivery, the upload file itself and the skills
    c38: chunk C38 - field size and family from the lobby row
    c39: chunk C39 - history store kept current
    c40: chunk C40 - Daily Faceoff age gate
    c41: chunk C41 - selection robust to field ownership error
    c42: chunk C42 - improvement pass after the greedy fill
    c43: chunk C43 - cloud parity
    c44: chunk C44 - caps in late swap and refresh
    c45: chunk C45 - cross-mode fee-weighted risk
