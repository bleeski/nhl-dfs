[pytest]
timeout = 120
addopts = --strict-markers
markers =
    c0a: chunk C0a - repo scaffold, contracts, exact scoring, tracker tooling
    c0b: chunk C0b - intake, byte-splicing export, independent referee
    c1: chunk C1 - adapters, cache, observations, prospective capture
    c2a: chunk C2a - priors, feasibility fallback, HiGHS candidate builder
    c2b: chunk C2b - local-first baseline run, atomic publish, manifest, CLI
    c2c: chunk C2c - four-state lock model, late swap, refresh
    c3: chunk C3 - ownership prior, field sampler, duplicate proxy, evidence gates
    c4: chunk C4 - history cache, identity crosswalk, as-of features
    c5: chunk C5 - opportunity, event-rate, and goalie models
    c6: chunk C6 - aggregate joint simulator, market fit, scoring arrays
    c7: chunk C7 - roles and news, deterministic
    c8: chunk C8 - scenario objectives, frontier, allocation, full run
    c9: chunk C9 - objective-aware refresh and late swap
    c10: chunk C10 - Claude Code layer, agents, controller, rehearsal
    c11: chunk C11 - settle, financial ledger, grading, run notes, gate reports
    c12: chunk C12 - field-model fit by contest family
    c13: chunk C13 - segment simulator challenger
