flag_recommendations:
  2: "Record Ben's 2026-10-02 answer in the flags table: 40% goalie and game fee share with the LINEUPS fallback (done in this plan); C27 fixes the feasibility test behind it."
  3: "Replace the placeholder mix with the observed one (5 to 10 entries per slate, 1 to 2 per contest, fees $0.10 to $1, 20-max and 150-max GPPs plus Showdown) so family priors and C21's sleeve sizes fit what Ben plays."
  8: "Keep the 0.85 DTD haircut and the 2-point field fade until C24 measures sitting DTD players; no change recommended now."
  9: "Keep the pooled-and-floored tie rule; C16 and C18 both rely on it and no tie has involved a paid place yet."
  11: "Choose uv.lock as the one lockfile and a dev group for pytest and pytest-timeout (B34); nothing in the queue waits on it."
  12: "Yes as the experiment default: a goalie Captain only when the simulator's goalie ceiling ranks top-3; C23 measures before any file changes."
  13: "A hard rule for large_gpp, small_field and wta lineups, cash and satellite exempt, reported by the referee; C20."
  14: "Yes: price on the cached template table when the contest page is 403, labeled PAYOUT_SOURCE=TEMPLATE, never for satellites or resized contests; C16."
  15: "Yes: when a run starts after the first game, build the open games, exclude STARTED_GAME rows, pin started-game cells and name them in the report; C15."
  16: "Default taken: persist only the small frozen record for a cloud run (the contest ids and forecast fields, a few KB) and never the 52 MB scenario directory; settle degrades to money and lineup match from data/entered and says so (B68, C29)."
  17: "Default taken: when a relayed packet value is wrong, relaunch the adversary with the exact printed packet; one reply per round; qa-apply records the packet hash it evaluated against (B81, C31)."
  18: "Default taken: tools/cloud_bootstrap.sh starts the history backfill in the background when the store is absent and Phase A never waits for it (B71, C39)."
  19: "Default taken: the delivery message names the refresh command and the lock time; no cloud scheduled routine is created until Ben registers one (B77, C43)."
  20: "Default taken: a first publish with no predecessor is never blocked for EDIT_STOP cells (it warns) and never changes cells of a game that has started; with a predecessor, pinned cells are diffed against it (B53, C14)."
  67: "Make the repo private: one setting closes B113 and keeps the bank (flag 66) and the facts table (flag 65) off the public web; a post-lock push needs a chunk, and a cloud container can be reclaimed before the slate locks, which would lose the record."
  113: "Keep it ON for now as the rule says, and treat the result as unproven: the measurement could tell lineups apart on first place, but on fresh draws the first-place lineups did not win more often on these two slates. C51's real-results replay is the real test; set objectives.goal back to top1pct if you would rather wait for it."
  107: "Keep the default: first place pays more than other places only in tiered tables (large GPP, small field, WTA); in a cash, satellite or Top N contest first place pays the same as any paid place. Let C55 ship once its noise check passes rather than wait for C51's real-results replay, which can still overturn it."
