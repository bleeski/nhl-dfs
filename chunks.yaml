# Machine-readable dependency graph and queue for BUILD_CHUNKS.md. Read by tools/next_chunk.py (built in C0a; queue fields and
# --render-queue added 2026-10-03). File order is the rank: NEXT is the first chunk whose dependencies are DONE and that is neither
# DONE, GATED nor BLOCKED on a [BEN] flag. Status lives in BUILD_STATUS.md, never here. checks run from the repo root; all must exit 0.
# Queue fields (Ben's priority rule, BUILD_CHUNKS.md "Queue"): band 0 legal file, 1 win large prizes, 2 prevent portfolio
# washouts, 3 everything else; size S under 100 changed lines, M 100 to 500, L 500 to 1,500 (XL must be split); effort is the
# reading load; breakpoint is the first committable hand-off point; needs lists the [BEN] flags that block a start; backlog and
# findings are the BACKLOG.md rows and review ids the chunk carries; impact is the rationale with its evidence named and judgment
# labeled. The archive behind the band-1 figures is one week of standings (17 contests); every such figure is thin.
version: 3
