# Plain-English layer of the roadmap page. tools/roadmap.py joins it with chunks.yaml (rank, title, band, size, depends)
# and BUILD_STATUS.md (status, dates) and builds the page Ben reads. The page publishes as a claude.ai artifact; the link
# and the publish steps are in docs/roadmap/README.md.
#
# Reader: Ben, who plays DraftKings NHL and is not an engineer. DFS words are fine (stack, chalk, ownership, leverage,
# Captain, late swap, GPP). Engineering words are not (solver, MILP, manifest, referee module, sha256, config key).
#
# One entry per chunk id in chunks.yaml. Fields:
#   title_seen  the chunks.yaml title when this entry was last reviewed. A retitled chunk fails the check until the
#               entry is reread and restamped with `python tools/roadmap.py stamp <id>`.
#   name        a plain name for the work, a few words.
#   goal        only for a chunk with no band in chunks.yaml: foundation, legal, win, washout or other.
#   what        what the work is, one or two sentences.
#   why         why we are doing it, with the evidence the chunk's impact text names. Never add a number it lacks.
#   matters     the business payoff: how it helps win money or protects the entry.
#   result      required once DONE: what happened, in plain words, including anything that did not work.
#   caveat      optional: an honest limit on a DONE result (for example built but not yet tested on real slates).
#   waiting     optional: what a BLOCKED or GATED chunk waits for, in plain words.
# Style: short sentences, active voice, no em dashes, dates written as "Oct 13".
#
# asks: the decisions or actions that wait on Ben. Remove one once it is done.
# updates: newest first, one line per dev session or queue change (what changed and what it means).

version: 1

goals:
  foundation:
    name: Foundation
    blurb: The engine itself. It reads your DraftKings files, projects players, simulates games, builds and checks lineups, and keeps score. Built Sept 26 to Sept 30.
  legal:
    name: A file DraftKings accepts
    blurb: Comes before everything else. A slate with no legal file, or a file DraftKings rejects, wins nothing.
  win:
    name: Win first place
    blurb: Anything that raises your chance of finishing first in each contest you enter. Your goal since Oct 14; before that it was winning large prizes in general. Stacks, goalie choice, ownership against the field, Showdown Captains, and choosing lineups for each contest's prize table.
  washout:
    name: Avoid a washed-out night
    blurb: Stops the whole portfolio from failing together. One goalie, game or line carrying too much, and dead or stranded entries.
  other:
    name: Upkeep and measurement
    blurb: Bookkeeping, measurement and cleanup, ordered by value against effort.

asks:
  - id: first-place-goal
    chunks: [C55]
    since: 2026-10-15
    question: Keep aiming each lineup at first place, or go back to the top 1% until the real-results replay (C51) has checked it?
    why: The engine passed the test it was given before any number (it can tell lineups apart on first place with 20,000 simulated nights), so first place is switched on. But on a second, independent set of simulated nights, the first-place lineups did not win their contest more often than the top 1% lineups on Sept 29 or Sept 30, and they cashed a little less. The likely reason is that a lineup that wins only 15 to 30 of 20,000 simulated nights gets picked partly for lucky wins.
    recommendation: Keep it on for now, since that is the rule you set, and let C51 settle it on real results. If you would rather wait, a session can set it back in one line (objectives goal top1pct in config/risk.yaml); nothing else changes.
  - id: repo-privacy
    chunks: [C48]
    since: 2026-10-10
    question: Make the GitHub repository private, or publish the entered-lineups record only after the last game locks?
    why: Today each slate's entered lineups go public on GitHub before lock, which you said is not acceptable. C48 would add the engine's forecasts to that same upload, so it is on hold until you choose.
    recommendation: Make the repository private. It is one GitHub setting, it closes the exposure, and C48 can start right away. Publishing after lock needs its own chunk first.
  - id: real-data-tests
    chunks: [C20, C21, C22, C23]
    since: 2026-10-13
    question: Run the real-slate tests on your machine.
    why: Four ideas were built in cloud sessions that had no saved real slates (goalie leverage, bigger stacks, keeping the chalk core, Showdown Captain rules). Each was tested only on made-up data, so each ships switched off. Three of them need the Sept 29 and Sept 30 Classic runs, which are saved on your machine.
    recommendation: Ask Claude in a local session to walk you through the copy-and-paste PowerShell block in docs/experiments/chalk_core_2026-10-13.md (goalie leverage, stack size, chalk core). The Showdown Captain block (docs/experiments/captain_2026-10-13.md) also needs saved Showdown runs from Oct 3 on, and as of Oct 13 your machine has none because those slates ran in the cloud, so for now it can only check the Captain pattern in your Oct 2 results. Nothing changes your lineups unless a test passes and you agree.

