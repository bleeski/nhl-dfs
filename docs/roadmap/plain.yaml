chunks:
  C0a:
    title_seen: Repo scaffold, contracts, exact scoring, tracker tooling
    name: Exact DraftKings scoring and the project skeleton
    goal: foundation
    what: Set up the project, wrote DraftKings' NHL scoring rules into code exactly as published, and built the tracker that tells each work session what to build next.
    why: Every later decision depends on scoring a lineup the way DraftKings does. One wrong point value would quietly skew every projection.
    matters: This is the ruler everything else is measured with, and the tracker keeps the build orderly across many sessions.
    result: Done Sept 26. DraftKings' Classic and Showdown rule files are the final authority in the project.
  C0b:
    title_seen: Intake, byte-splicing export, independent referee, real-file fixtures
    name: Read your DraftKings files and write an upload DraftKings accepts
    goal: foundation
    what: The engine reads the salary and entries files you download from DraftKings and writes your lineups back into the entries file without touching anything else in it. A separate checker (the referee) re-checks every lineup against the rules before you see the file.
    why: DraftKings rejects an upload with one malformed row. The referee is written separately from the builder so a bug in one cannot hide in the other.
    matters: No legal file means no entry and no chance to win. This is the safety net under every slate.
    result: Done Sept 28, tested on your real files from Sept 29.
  C1:
    title_seen: Adapters, cache, observations, prospective capture
    name: Collect outside data with timestamps
    goal: foundation
    what: Connections to outside sources (DraftKings player data, NHL.com, betting odds) with a local cache, plus scheduled tasks that capture data through the day and record when each item was seen.
    why: The models need news and odds, and fair grading later needs to know what was known before lock.
    matters: Honest timestamps let us judge the engine using only what it could have known at the time.
    result: Done Sept 28. DraftKings blocks the engine's direct requests for some player data, so a saved copy from your browser is used in tests. You registered 12 capture tasks on your machine.
  C2a:
    title_seen: Priors, feasibility fallback with result states, HiGHS candidate builder
    name: First projections and a fast lineup builder
    goal: foundation
    what: Simple starting projections from DraftKings' average points and salary, and a builder that makes many distinct legal lineups in seconds, with a slower backup that always finds a legal lineup if one exists.
    why: We needed a working lineup machine before any smart modeling, so a slate never ends with nothing to upload.
    matters: It builds 150 different legal Classic lineups in about 4.5 seconds, fast enough for late swaps near lock.
    result: Done Sept 28.
  C2b:
    title_seen: Local-first baseline run, atomic publish under a slate lock, manifest, CLI
    name: One command builds a checked file, even offline
    goal: foundation
    what: The run command builds a complete, checked upload file from your two DraftKings files alone, then improves it with online data if time allows. Each version is saved safely, so a half-written file can never replace a good one.
    why: Websites fail and lock times are fixed. The first good file has to come from local data alone.
    matters: You always get an uploadable file fast (about 11 seconds for 150 Classic entries), and online improvements can never break it.
    result: Done Sept 28.
  C2c:
    title_seen: Four-state lock model, late swap, refresh (baseline objective)
    name: Late swap that respects locked players
    goal: foundation
    what: The engine knows which games have started, never moves a player whose game has locked, and stops editing a game shortly before it starts. Late swap and refresh rebuild only the open spots.
    why: DraftKings refuses changes to started games, and news keeps arriving after the first puck drop.
    matters: You can react to late scratches and goalie news without risking a rejected file.
    result: Done Sept 28. Milestone 1 reached, an uploadable legal file offline with safe late swap.
  C3:
    title_seen: Ownership prior, field sampler, duplicate proxy, evidence gates, provisional leverage selection
    name: Model the other players in the contest
    goal: foundation
    what: Estimates how often the field will roster each player, simulates the lineups opponents are likely to enter, estimates duplicate risk, and starts to favor lineups that differ from the crowd.
    why: In big tournaments you win by beating thousands of other lineups, so what they play matters as much as who scores.
    matters: This is the start of leverage, picking good lineups the field is underweight on so a win is not split with duplicates.
    result: Done Sept 28. Milestone 2 reached. Day-to-day players count as questionable, still eligible, priced for both risk and leverage.
  C4:
    title_seen: History cache (MoneyPuck or NHL per-game reports), identity crosswalk, as-of features
    name: Two seasons of player history
    goal: foundation
    what: Downloaded two seasons of per-game NHL data (about 100,000 skater games) and matched DraftKings names to NHL player records.
    why: Projections built from real ice time and shot rates beat projections from DraftKings' season average alone.
    matters: It is the raw material for every model that follows.
    result: Done Sept 28. On the Sept 29 slate, 242 players matched automatically, 16 needed review and 50 had no match.
  C5:
    title_seen: Opportunity, event-rate, and goalie models, per person
    name: Player projections from ice time and shot rates
    goal: foundation
    what: Per-player models for how much a skater plays and how often he shoots, scores, assists and blocks shots, plus goalie models.
    why: DraftKings points come from these events, so modeling the events gives better projections and real ranges of outcomes.
    matters: Better projections sit under every lineup choice. Players without history fall back to the simple starting projection.
    result: Done Sept 28. On the Sept 29 slate, 168 of 308 players had history-based projections, 64 were mixed and 76 used the fallback.
  C6:
    title_seen: Aggregate joint simulator, market fit, scoring arrays, calibration harness
    name: Simulate every game thousands of times
    goal: foundation
    what: A game simulator that plays each game out 20,000 times so teammates rise and fall together, can line up with betting-market totals, and comes with a check against real past games.
    why: Tournaments are won on correlated ceilings, like a line that goes off together. Averages alone cannot see that.
    matters: Simulated outcomes let the engine pick lineups for their upside in a specific contest, beyond their average.
    result: Done Sept 29. 20,000 simulations take about 7 seconds. The check flagged two possible weaknesses (3+ point games happen more often than the model expects, and linemates' shared big nights look off), which C25 rechecks. Both odds feeds were unusable that day, so games ran on the model alone.
  C7:
    title_seen: Roles and news, deterministic
    name: Starting goalies, lines and injury news
    goal: foundation
    what: Reads projected starting goalies, line combinations, power-play units and injury statuses, and flags players to monitor.
    why: An unconfirmed or wrong goalie, or a scratched skater, is a zero in your lineup.
    matters: Protects lineups from dead spots and puts players in their real roles.
    result: Done Sept 29. At first this news reached only some steps of the build. Later chunks wired it in, and C28 finishes the job.
  C8:
    title_seen: Scenario objectives by contest family, evidence states, frontier, allocation, full run
    name: Pick lineups for each contest type
    goal: foundation
    what: Scores every candidate lineup against the simulated games and the simulated field using each contest's prize table, then assigns lineups to your entries while spreading risk.
    why: A cash game, a 20-entry max and a 150-entry tournament reward different lineups. One ranking for all of them leaves money on the table.
    matters: This is the full engine, with lineups chosen for what they can win in the contest they are in.
    result: Done Sept 29. Milestone 3 reached. A full Classic run took about 74 seconds offline. The risk limits were placeholders until you set them on Oct 2 (at most 40% of fees on one goalie or one game).
  C9:
    title_seen: Objective-aware refresh and late swap
    name: Smarter late swaps
    goal: foundation
    what: Late swap and refresh use the same simulation-based scoring as the main build instead of the simpler ranking.
    why: Decisions near lock should be as good as the ones made at build time.
    matters: A late scratch gets the best replacement for that contest, in about 15 seconds.
    result: Done Sept 29.
  C10:
    title_seen: Claude Code layer, agents, controller, rehearsal, measured usage
    name: Claude runs the slate with a researcher and a critic
    goal: foundation
    what: The commands you use with Claude (run, late swap, refresh), a researcher agent that confirms news on the web, and a critic agent that reviews the portfolio and proposes changes, which the engine tests before accepting.
    why: You should be able to run a slate in plain English, with news checked and a second opinion, while Claude never hand-edits lineups.
    matters: Every change still passes through the engine and the rules check, so convenience never costs file safety.
    result: Done Sept 30.
  C11:
    title_seen: Settle, financial ledger, grading, run notes, backlog, gate reports
    name: Score our results and keep the books
    goal: foundation
    what: After a slate, the engine reads contest standings, records winnings and fees in a ledger, grades its own forecasts and writes improvement ideas to the backlog.
    why: We can only improve what we measure, and money in and out has to be tracked exactly.
    matters: Every slate becomes evidence about what works.
    result: Done Sept 30. Milestone 4 reached, the learning loop and ledger are live. On the first graded slate, ownership forecasts correlated 0.64 to 0.76 with actual ownership.
  C14:
    title_seen: Lock-safe publishing, a live clock in QA rounds and lock-aware initial-run publish
    name: Never publish changes to started games
    what: Closes two ways the engine could write a change into a game that had already started. One was a review round that ran past lock, the other a first build that crossed a game start while it was running.
    why: A test reproduced both, including one file with 16 started-game changes that still passed the checks. DraftKings rejects those changes.
    matters: A file DraftKings rejects wins nothing, and this could happen on any slate.
    result: Done Oct 4.
  C15:
    title_seen: Started slates, pins for started-game occupants, builds that exclude started games, a stable slate id
    name: Build a slate after the first game starts
    what: When you open a slate late, the engine builds lineups for the games still open, keeps started-game players in place and reports what it left out, instead of refusing to build.
    why: On Oct 2 the salary file was downloaded after a game had started, the engine refused, and there was no engine file that night.
    matters: You get a file even when you start late, and started-game players are never lost.
    result: Done Oct 5.
  C16:
    title_seen: Payout curves from DraftKings template tables, at build time and in settle
    name: Use the real prize tables
    what: Prices each contest on DraftKings' actual payout table for that contest type and size, using saved copies when DraftKings blocks the live page.
    why: Every run before this guessed the prize table. Real tables pay about 23 to 24% of entries on a top-heavy ladder, and the guess assumed 20%.
    matters: Lineups are chosen for what they can actually win, on every slate, since your contests use standard templates.
    result: Done Oct 5. One small part, checking your reported winnings for one contest (196228907), waits on an amount you have not entered yet.
  C38:
    title_seen: Field size and family from the lobby row when the contest page is unavailable
    name: Know each contest's real size
    what: When the contest page is blocked, reads the field size and contest type from the DraftKings lobby listing.
    why: The engine had been assuming 5,000 entrants for contests that really had about 400, under 100, or about 27.
    matters: Field size decides how different a lineup needs to be. Getting it wrong picks the wrong kind of lineup, especially in cloud runs, where every contest page is blocked.
    result: Done Oct 5.
  C17:
    title_seen: Inputs that move lineups reach the models, odds and roles into the field features, team rates and the market clip
    name: Feed odds and line news into the ownership forecast
    what: Connects game totals, starting goalies, power-play units and line news to the forecast of what the field will play, and to team scoring rates.
    why: These settings existed but never received data. On Sept 30 the forecast had Toronto stacked by 42% of the field (actual 21 to 24%) and Colorado by 19% (actual 38 to 51%).
    matters: An accurate read of the field is the basis of leverage. Missing two teams by 20 points means fading the wrong stacks.
    result: Done Oct 6.
    caveat: On the one slate replayed (Sept 30), the forecast with the new inputs was slightly worse than without them. A five-slate check is still pending.
  C39:
    title_seen: History store kept current in-season and on every host
    name: Keep player history up to date
    what: Adds this season's games to the history store each day, on your machine and in cloud sessions.
    why: History stopped at last season, so this season's form, ice time and goalie back-to-backs never reached the models, and cloud runs had no history at all.
    matters: Projections reflect what is happening now, and goalie back-to-back detection can work.
    result: Done Oct 6.
  C49:
    title_seen: DraftKings entry history and the results report against a random baseline
    name: Score the engine against your real results
    what: Reads your DraftKings entry history and compares the engine's finishes with what random lineups would have done in the same contests.
    why: The engine had never been scored on real results, and every other improvement needs that yardstick.
    matters: It is the engine's first real report card, and every later measurement builds on it.
    result: Done Oct 11. Classic, 136 entries, cashed 23 times against 32 expected for random lineups and reached the top 10% 8 times against 13.5. Showdown, 78 entries, cashed 34 times against 22 expected. Both samples are small.
  C53:
    title_seen: Real post-lock exports readable (LOCKED cells), versioned delivery file names, Ben as a news source
    name: Late swap after the first lock, with versioned files
    what: The engine reads the entries file DraftKings gives you after the first game locks (cells marked LOCKED), and each version of the upload file gets its own name. News you report in the session counts as a source.
    why: On Oct 11 late swap could not read your post-lock file at all. A repair version went in after the first game started, DraftKings refused 8 rows, and 8 of 28 entries were left with a dead slot.
    matters: Late swap works on the live file all night, and you always know which version you uploaded.
    result: Done Oct 12.
  C54:
    title_seen: RotoWire NHL news as a second goalie and scratch source
    name: RotoWire as a second goalie and scratch source
    what: Adds RotoWire's NHL news beside Daily Faceoff as a source for starting goalies and scratches.
    why: On Oct 11 Daily Faceoff still listed two goalies as expected well after both teams had confirmed them, and RotoWire had already posted one of the confirmations.
    matters: A goalie who does not start is a whole dead spot. A second source catches confirmations sooner.
    result: Done Oct 12.
  C48:
    title_seen: Forecast record per entered lineup and the scored bank, kept beside the entered record
    name: Save what the engine predicted for every entered lineup
    what: For every lineup you enter, keep a small record of what the engine expected and the pool of lineups it considered, next to the record of your entries.
    why: That record lives only inside the run folder today, and a cloud session loses it. The forecasts for 181 entries from Oct 3 to Oct 9 are already gone.
    matters: Without it we cannot check whether the engine's predictions hold up, and the main Classic measurement (C51) cannot run. Every slate without it is a permanent loss.
    waiting: Your decision on repository privacy (see Waiting on you).
  C56:
    title_seen: "Referee-checked edit command, the model's write path"
    name: Let Claude fix lineups when the engine has a gap
    what: Today Claude can point out a problem in the lineups but cannot fix it, because every change has to pass a strict test built for first-place gains. This adds a controlled way for Claude to change lineups itself. Any open slot, any number of entries, a reason written down, a check for legality and locks, and a record kept so the old file can be restored.
    why: On Oct 17 Claude saw that 11 of 13 lineups sat on one game's goalies with no Carolina or Tampa goalie, found two legal fixes, and could not apply either.
    matters: The engine is good at point projections and bad at noticing what is missing. Claude's job is to notice, and that only helps if it can act before lock.
  C57:
    title_seen: "Gap report, the model's reasoning pass and grading of its edits"
    name: Show Claude what is missing and grade its changes
    what: Gives Claude a table of every goalie on the slate and a warning when a team or game has no lineup, makes a review of gaps part of every run, prints what each change does to first-place and washout odds, and later checks whether Claude's changes beat the engine's own lineups.
    why: Claude could not see the unused goalies, and nobody can tell yet whether its edits help.
    matters: Authority to change lineups should grow where it wins and shrink where it does not.
  C59:
    title_seen: "Replay settled contests to check the model's goalie link and field strength"
    name: Check the model's goalie link against real standings
    what: A planned replay of past contests in the simulator to see whether the model gives the best goalie of the night as much credit as the real standings do. In the Oct 17 seven-entry contest the model says holding the best goalie raises our chance of finishing first by only about 2 points, while the standings synthesis found the winning goalie in almost every top lineup.
    why: Every goalie decision, and every check Claude will run on a lineup change, rests on how the model links goalies to first place.
    matters: If the model understates goalies we leave first-place chances on the table. If the standings overstate them we would be chasing one week's pattern.
    waiting: The replay needs your saved runs and standings, so the last step runs on your machine.
  C62:
    title_seen: "Edit evaluator on held-out draws with a Pareto accept rule"
    name: A fair scorer for lineup changes
    what: Builds the tool that scores any proposed change on both goals, using simulated nights the original lineups were not chosen on, and accepts a change automatically only when it is clearly better on one goal and worse on neither.
    why: The same swap scored as a loss on one set of simulated nights and a much smaller loss on another, so a scorer that reuses the nights that built the lineups will find gains that are noise.
    matters: Claude will test many ideas before lock. Without a fair scorer, the more it tries the more false wins it finds.
  C61:
    title_seen: "Research request covers the lines and power plays of stacked teams"
    name: Ask the researcher about the teams we stack
    what: Today the research step only checks goalies. This also asks it to check the lines and power-play units of the teams our lineups stack, when the page the engine reads is more than a day old.
    why: On Oct 17 Tampa held 23 of 56 skater slots in the seven-entry contest on line information the engine had thrown out as stale, and nobody checked it.
    matters: A stack is only as good as the lines behind it.
  C60:
    title_seen: "Projection adjustments from research with provenance, bounds and grading"
    name: Let research change projections, in small logged steps
    what: Claude can change a player's line or power-play unit today, but not how many points he is expected to score. This adds small, capped, dated and sourced adjustments to a player's expected minutes, average and ceiling, logs each one, and later grades it against what the player really scored.
    why: On Oct 17 four teams' line pages were a day old and unused, so even a researcher who found a line change could not have moved the projections.
    matters: Projections are what the lineup builder trusts, so better inputs help every lineup and not only the ones Claude edits.
  C58:
    title_seen: "Goalie-first allocation experiment (preregistered)"
    name: Test building lineups goalie first
    what: A planned experiment that builds each entry around its goalie, spreads the goalies across a contest's entries by how much each is worth, and compares that with today's lineups and with the rule of using every goalie once.
    why: On Oct 17 the seven-entry contest used two goalies. Covering all six sounds right, but a second entry on the best goalie can be worth more than a first entry on a long shot, so we measure before we choose.
