    title_seen: Selection robust to field ownership error (low, base and high ownership)
    name: Lineups that hold up if the ownership forecast is off
    what: Tests lineups against lower-owned and higher-owned versions of the field, not just the single best guess.
    why: Player ownership forecasts miss by about 4 points on average, and team stack shares missed by 20 points on Sept 30.
    matters: A lineup that only works if the forecast is exactly right can be badly placed in reality. If it would change which lineups are picked, it waits on C51's answer.
    result: Done Oct 16. All three graded forecasts (Sept 29 and Sept 30) were chalkier than the real field; on Sept 30 the players we forecast at 10% or more were owned about a quarter less than forecast. The engine now builds a flatter and a chalkier version of the field sized to that miss, and on the Sept 29 and Sept 30 slates (30 entries) it checked which picks change. By the test written before any number, the ownership miss changes picks, narrowly (29 against 23 and 21 against 19). The bigger finding is that simply drawing the same field again changes most picks too (16 to 23 of about 30), so many picks on these slates are close calls the engine cannot separate. A way to pick lineups that hold up across all three fields is built but switched off, and waits on C51. The new report is switched off too, because it adds 1.5 to 2 minutes to a 30-entry run. Lineups are unchanged.
    caveat: Two slates and a field model that is still a starting guess. The switched-off option did not clearly help on fresh simulated nights (within about one standard error either way). The time cost was measured while other programs ran on the computer.
