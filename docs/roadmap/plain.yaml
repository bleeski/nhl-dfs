  C25:
    title_seen: Clean calibration constants, the co-ceiling cause, and the 3+ point tail preregistration
    name: Recheck how well the simulator matches real games
    what: Redoes the simulator's accuracy check on clean data, finds out why linemates' shared big nights look off, and writes the test plan for 3+ point games.
    why: The first check (Sept 29) used league numbers that included the very games it was tested on, so its warnings are not reliable yet.
    matters: Tournaments are won on ceilings. This confirms whether the simulator undersells them before anyone tunes it, and it unlocks C13. No tuning happens here.
    result: Done Oct 16. The accuracy check was redone with league averages that leave out the 10 test nights, and the grades did not change. Real players still have 3+ point nights about 1.4 times as often as the simulator expects (1.41, against 1.40 before). The check then compared the simulator's lines with who really played together each night. When the engine groups real linemates correctly, it ties their big nights together more tightly than real games do, which can overrate full-line stacks; that cause is now named. When it splits real linemates, it underrates their shared big nights almost 3 times over, but a small-sample guard I added to your rule kept that second cause from being named, and your rule without my guard would have named both. You chose on Oct 16 to keep the result as recorded, so the second finding goes to C13 as a description. The test plan for a hot-line boost is written before any code, and this result predicts the boost would fail it. Lineups did not change.
    caveat: One season, 10 nights and small counts (36 and 26 shared big nights). How much these gaps cost real lineups was not measured; the fix belongs to C13. Two league numbers in the engine (the goalie save rate and how assists split per goal) could not be rebuilt from the stored games, so they were left as they were and are listed for a later fix.
  C55:
    title_seen: "First-place equity as each contest's goal (large GPP and small field), the washout goal unchanged"
    name: Aim each lineup at first place
    what: Each tournament and small-field lineup is picked for its chance to win its own contest outright, instead of its chance to land in the top 1% or its average payout. Avoiding a washed-out night stays the second goal, unchanged. Cash, Booster and satellite contests keep their goal, because first place there pays the same as any cashing spot.
    why: You asked for it on Oct 14. Today only winner-take-all contests aim at first place. Winning outright is rare, so the engine first measures on the Sept 29 and Sept 30 slates whether it can tell lineups apart on it, and how far its simulated winning scores sit from the real ones. If it cannot, the switch stays off and you get the numbers.
    matters: A lineup built to win outright is often not the one built to finish in the top 1%. The cost is fewer cashes. Classic already cashed less often than expected under the top 1% aim (23 times in 136 against 32 expected), and aiming at first place will cash less often still. The Classic replay (C51) will check the trade against real results.
    result: Done Oct 15, switched on. With 20,000 simulated nights the engine could tell lineups apart on first place in all five tournaments of Sept 29 and Sept 30 (the test set before any number, passed narrowly). Big tournaments and small fields now aim at first place; cash, Booster and satellite contests are unchanged, and late swap still aims at the top 1% because with its 4,000 or 8,000 nights first place was too noisy. The top 1% numbers are still shown. The risk of losing most of the night's fees stayed tiny either way (at most 1.6% against your 60% limit), and the first-place lineups cashed slightly less.
    caveat: On a second, independent set of simulated nights the first-place lineups did not win their contest more often than the top 1% lineups did (Sept 29 Daily Dollar 7.8% against 7.9% for 29 entries; Sept 30 Hip Check 1.9% against 2.0% for 26 entries). Two slates only, contest sizes taken from those same contests, no small-field contest on either slate. The real-results replay (C51) is the test that counts.
