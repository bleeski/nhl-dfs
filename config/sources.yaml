# Keyless sources behind data/http.py. Seconds everywhere. Plan section 3.
http:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
  timeout_s: 6
  retries: 1            # one retry after retry_after_s for timeouts, connection errors, 5xx
  retry_after_s: 1
  max_calls_per_run: 200  # every request attempt counts; past this SourceUnavailable("budget")
  min_interval_s:       # per-host spacing between requests
    default: 0.5
    www.dailyfaceoff.com: 3.0
    www.covers.com: 2.0

ttl_s:
  dk_lobby: 900
  dk_contest: 900
  dk_draftables: 300
  nhl_schedule: 900
  nhl_roster: 21600
  nhl_boxscore: 3600
  nhl_gamelog: 21600
  nhl_report: 21600
  nhl_goalie_report: 21600
  nhl_partner_odds: 600
  covers: 600
  dailyfaceoff: 600
  nhl_standings: 86400

urls:
  dk_lobby: "https://www.draftkings.com/lobby/getcontests?sport=NHL"
  dk_contest: "https://api.draftkings.com/contests/v1/contests/{contest_id}?format=json"
  dk_draftables: "https://api.draftkings.com/draftgroups/v1/draftgroups/{draft_group_id}/draftables?format=json"
  nhl_schedule: "https://api-web.nhle.com/v1/schedule/{date}"
  nhl_roster: "https://api-web.nhle.com/v1/roster/{team}/current"
  nhl_boxscore: "https://api-web.nhle.com/v1/gamecenter/{game_id}/boxscore"
  nhl_gamelog: "https://api-web.nhle.com/v1/player/{nhl_id}/game-log/{season}/{game_type}"
  nhl_report: "https://api.nhle.com/stats/rest/en/skater/{report}?isAggregate=false&isGame=true&start={start}&limit={limit}&cayenneExp={exp}"
  nhl_goalie_report: "https://api.nhle.com/stats/rest/en/goalie/{report}?isAggregate=false&isGame=true&start={start}&limit={limit}&cayenneExp={exp}"
  nhl_partner_odds: "https://api-web.nhle.com/v1/partner-game/US/now"
  covers: "https://www.covers.com/sport/hockey/nhl/odds"
  df_goalies: "https://www.dailyfaceoff.com/starting-goalies"
  df_lines: "https://www.dailyfaceoff.com/teams/{slug}/line-combinations"

report_page_limit: 100
covers_preferred_books: ["DraftKings", "FanDuel", "BetMGM"]

# MoneyPuck (C4, flag 6: personal DFS use accepted with attribution). Terms on
# https://moneypuck.com/data.htm, read 2026-09-28: "free to use for non-commercial purposes",
# credit MoneyPuck.com wherever its data is an input, and "Non-approved scraping ... will be
# blocked". Only the files listed on that page are downloaded; data/history/moneypuck.py refuses
# any (kind, level) not listed here. {season} is MoneyPuck's start year (2025 = 2025-26).
moneypuck:
  enabled: true
  attribution: "Includes data from MoneyPuck.com (moneypuck.com/data.htm), used for non-commercial personal analysis."
  raw_root: data/raw/moneypuck
  max_age_s: 86400
  listed:
    skaters:
      game: "https://peter-tanner.com/moneypuck/downloads/seasonPlayersSummary/skaters/{season}.zip"
      season: "https://moneypuck.com/moneypuck/playerData/seasonSummary/{season}/regular/skaters.csv"
    goalies:
      game: "https://peter-tanner.com/moneypuck/downloads/seasonPlayersSummary/goalies/{season}.zip"
      season: "https://moneypuck.com/moneypuck/playerData/seasonSummary/{season}/regular/goalies.csv"
    lines:
      game: "https://peter-tanner.com/moneypuck/downloads/seasonPlayersSummary/lines/{season}.zip"
      season: "https://moneypuck.com/moneypuck/playerData/seasonSummary/{season}/regular/lines.csv"
    teams:
      game: "https://moneypuck.com/moneypuck/playerData/careers/gameByGame/all_teams.csv"  # every season in one file
      season: "https://moneypuck.com/moneypuck/playerData/seasonSummary/{season}/regular/teams.csv"
    shots:
      game: "https://peter-tanner.com/moneypuck/downloads/shots_{season}.zip"
  # Kinds the history backfill downloads (teams and shots load on demand; not needed before C5).
  backfill_kinds: [skaters, goalies, lines]

# History backfill (C4). Runs outside any slate clock with its own call budget.
history:
  store_root: data/features/history
  max_calls_per_backfill: 400
  window_days: 21        # report date window; split when a window reaches total_cap
  total_cap: 10000       # the NHL stats REST reports total at most this; treat as possibly truncated
  evict_raw: true        # B2: after a clean backfill, drop report bodies whose rows are in the store (see nhl_reports.evict_raw)
  keep_unindexed_days: 7 # an unreferenced body (a schema failure kept for diagnosis) is deleted after this many days
  crosscheck_boxscores_per_season: 2
  # C39 (B70, B71): how current the store is, measured by data/history/status.py
  fresh_days: 1          # CURRENT when the newest regular-season game is at most this many days before the as-of date, i.e. the store
                         # holds the last finished day and the back-to-back flag can see last night (B70's 'within 2 days' is the
                         # acceptance; 2 here would leave yesterday missing on every other day, so a run refreshes from 2 days behind)
  complete_after_h: 3    # an Eastern day counts as complete this many hours after its midnight (late games finish after it)
  bootstrap_stale_min: 30  # a RUNNING cloud-bootstrap backfill older than this, or whose process is gone, reads ABANDONED
  refresh_overlap_days: 2  # the in-run refresh fetches again this many days before the newest stored game (corrects partial rows)
  refresh_max_calls: 40    # the in-run refresh's own request cap (a catch-up from the season start is about 8 requests)
