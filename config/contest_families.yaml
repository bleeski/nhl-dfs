# Contest families (C3). Used when the DK contest endpoint is unavailable (offline, 403, timeout)
# and to classify contests whose detail was fetched. Engineering placeholders until flag 3
# (typical entry mix) is answered; every value taken from here is labeled PAYOUT_SOURCE=PRIOR
# and field size source "family_prior" in the manifest and RUN_NOTES. Nothing here is a fact
# about a real contest.

# Name patterns: case-insensitive regular expressions, checked in this order; first match wins.
# A name that matches nothing falls to `default_family` and is reported as family source
# "default". It never becomes cash by accident.
# top_n (C47, flags 68 and 71): a "Top N Win $X" name (DraftKings' Boosters) counts only when it writes both N and $X
# (models/contests.py reads them); otherwise the next pattern is tried. It sits after satellite and cash, the order C49's
# results report uses, so a Triple Up named "[Top 9 Win $3]" stays cash.
name_patterns:
  - {family: satellite, pattern: "satellite|qualifier|\\bsat\\b"}
  - {family: cash, pattern: "double up|triple up|quintuple up|50/50|fifty-fifty|head-to-head|\\bh2h\\b"}
  - {family: top_n, pattern: "\\btop\\s+\\d+\\s+win\\b"}
  - {family: wta, pattern: "winner take all|\\bwta\\b"}
  - {family: small_field, pattern: "small field"}
default_family: large_gpp

# Classification from an exact payout table (contest detail fetched): WTA when only 1st place is
# paid; cash when at least cash_min_paid_fraction of the field is paid one flat amount; small
# field when maximum entries <= small_field_max_entries; otherwise large GPP. A satellite name
# pattern still wins (tickets are prizes, not cash), and a top_n name whose table pays one flat cash amount is top_n.
exact_rules:
  cash_min_paid_fraction: 0.30
  small_field_max_entries: 500

families:
  cash:
    selection: mean  # highest projected mean; no leverage
    field_size_prior: 200
    paid_fraction_prior: 0.45
  satellite:
    selection: mean  # C8 gives satellites their own threshold objective; until then, mean
    field_size_prior: 200
    paid_fraction_prior: 0.10
  wta:
    selection: dup_first  # lowest duplicate proxy within the tie band
    field_size_prior: 10
    paid_fraction_prior: 0.10
  small_field:
    selection: dup_first
    field_size_prior: 100
    paid_fraction_prior: 0.20
  large_gpp:
    selection: own_then_dup  # lower lineup ownership, then lower duplicate proxy, within the band
    field_size_prior: 5000
    paid_fraction_prior: 0.20
  top_n:  # C47: "Top N Win $X" (Boosters); N flat prizes of $X read from the name, objective P(at least one own entry in the top N)
    selection: finishes  # inside the band, more expected top-N finishes (flag 70); the provisional pass ranks it as mean
    field_size_prior: 200  # schema placeholder: a top_n contest is sized from its lobby row or its name, never from this
    paid_fraction_prior: 0.02  # schema placeholder, as above

# Payout templates (C16, [BEN] flag 14): a contest whose DraftKings page is unavailable is priced on the cached table of
# the same template (same name without the game suffix, same max entries, same fee and prize pool), labeled
# PAYOUT_SOURCE=TEMPLATE, at build time and in settle. Never for satellites or resized contests. Set false to price
# every such contest on the declared priors below (PRIOR) again.
payout_templates:
  enabled: true

# Field size and family from the lobby row (C38, [BEN] flag 29): a contest whose DraftKings page is unavailable and that
# no template matched takes its field size from the lobby capture's max entries (labeled FIELD_SIZE_SOURCE=LOBBY), and a
# contest whose family came only from `default` at or under exact_rules.small_field_max_entries entries is small_field
# (the same cut the exact path uses). Name-pattern families keep their family. PAYOUT_SOURCE is not touched: the payout
# curve is still the prior. Set false to size every such contest on the family priors above (FIELD_SIZE_SOURCE=PRIOR).
lobby_field_size:
  enabled: true

# Contest facts from Ben's entry history (C50, flags 65 and 73 to 79): a contest that the page, a template, the lobby row and
# the Top-N name rule all leave unpriced, and whose mode, name (without the game, k/n and Early or Late suffix) and fee match a
# row of data/contest_facts/nhl.csv, is sized at the row's most entrants seen (FIELD_SIZE_SOURCE=HISTORY) and priced on the
# family's prior shape below with the row's prize pool and places paid (PAYOUT_SOURCE stays PRIOR). Never for satellites or
# Top N Win names. Set false to restore the earlier result exactly.
contest_facts:
  enabled: true

# Payout curve priors (C8, build/objectives.prior_curve). Used only when the DK contest endpoint
# did not describe the contest (PAYOUT_SOURCE=PRIOR, after payout_templates found no table); every figure built on them is an
# uncalibrated scenario proxy. A contest facts row (C50) replaces the rake's pool and the paid fraction, never the shape. PLACEHOLDERS: rake, shapes, min-cash multiple and exponent are
# engineering choices, not facts about DK contests.
payout_priors:
  rake: 0.15                    # share of fees not returned as prizes
  families:
    cash:        {shape: flat}                                   # paid_fraction_prior of the field, one flat prize
    satellite:   {shape: tickets}                                # seats = paid_fraction_prior x field; face value = pool / seats
    wta:         {shape: wta}                                    # first place takes the pool
    small_field: {shape: power, min_cash_mult: 2.0, exponent: 1.1}
    large_gpp:   {shape: power, min_cash_mult: 2.0, exponent: 1.1}  # last paid position = 2 x fee; top-heavy power law above
    top_n:       {shape: flat}  # a guard only: a top_n contest is priced on the table its name states (C47)

# Provisional selection (build/provisional.py, plan section 7 "Deterministic tie-break").
selection:
  # Tie band on the lineup's projected mean: max(tie_band_pct * anchor mean, floor). The floor is
  # the ranking metric's Monte Carlo standard error (plan section 7: the band "is never smaller
  # than that metric's Monte Carlo standard error"): lineup prior sd (independence sum, Captain at
  # 1.5x) / sqrt(band_floor_sims). band_floor_sims is the number of simulated draws behind the
  # ranking metric. Before C6 the ranking mean is exact arithmetic on priors (no simulation), so
  # it is null and the floor is 0: the percentage governs. C6/C8 set it to the simulation count.
  tie_band_pct: 0.03
  band_floor_sims: null
  # DTD (day-to-day, Ben 2026-09-28) maps to QUESTIONABLE: still eligible, known injury. The
  # provisional ranking prices the risk as an expected-value haircut: a QUESTIONABLE person's
  # mean counts at this play probability. A labeled prior, not news; the baseline (v1) has no
  # haircut. The leverage side is the field's fade in config/ownership.yaml (weights.questionable).
  questionable_play_prob: 0.85
  # Order in which contest groups are filled so exposure caps bind last on cash entries.
  family_order: [cash, satellite, wta, small_field, large_gpp, top_n]  # top_n last (C47, flag 68)
