# Risk budget, frontier and scenario-objective settings (C8, plan section 7).
#
# [BEN] flag 2: set the risk budget. Every value below is the plan's PLACEHOLDER, in force until
# Ben answers. None of it is a fact about any contest or a claim about profitability.

budget:
  classic:
    p_lose80_max: 0.60          # P(losing at least 80% of slate fees) at most this
    goalie_fee_share_max: 0.40  # share of fees in entries that use any one goalie
    game_fee_share_max: 0.40    # share of fees whose lineup's primary game is one game; only when the slate has > 1 game
    captain_fee_share_max: null
  showdown:
    p_lose80_max: 0.60
    goalie_fee_share_max: 0.40
    game_fee_share_max: null    # a single-game slate cannot diversify its game
    captain_fee_share_max: 0.40 # Showdown concentration is measured by Captain share (and the shared failure scenario, reported)
  # The achievable floor of each budget is computed and recorded (build/exposure.fee_floor), never hidden.
  # Goalie and game budgets (B36, Ben 2026-10-01): when the floor is at or under the budget the cap is
  # in dollars (fee share), hard. When the floor is above it (unequal fees: on 2026-10-01 one $1 entry
  # was 59% of $1.70) the cap becomes lineups instead: at most max(1, floor(share x entries)) of all
  # entries per goalie (per primary game), rounded DOWN so the share is never exceeded. 0.40 of 5
  # entries is 2; of 3 entries, 1. The same key sets both modes. Printed as GOALIE_CAP= / GAME_CAP=.
  # (config/exposure.yaml tournament.classic.goalie is a separate count cap for 20+ tournament entries.)
  # The Captain budget is compared against max(budget, floor).

# Frontier: five knob settings. kappa prices the portfolio's P(lose >= 80% of fees) against the
# tail utility, both in dollars (kappa x total fees x delta probability). Knob 0 is pure tail.
frontier:
  kappas: [0.0, 0.25, 0.5, 1.0, 2.0]

# Deterministic tie-break (build/tiebreak.py): the band on a metric is
# max(band_pct x |anchor value|, se_mult x anchor Monte Carlo standard error), never below the SE.
tiebreak:
  band_pct: 0.03
  se_mult: 1.0

# The own-goalie rule (C20, [BEN] flags 13 and 51 to 53; build/own_goalie.py): an entry of one of these contest families
# never holds a skater who plays against its own goalie. Classic only (Showdown is out). Cash and satellite are exempt.
# enabled: false switches the rule off everywhere (discovery, selection, late swap, QA); the OWN_GOALIE line then says OFF.
own_goalie:
  enabled: true
  families: [large_gpp, small_field, wta]

# Candidate discovery (build/portfolio.discover): search allocation, not scenario probabilities.
discovery:
  families: [0.65, 0.25, 0.10]   # central case, alternate viable cores, "priors wrong"
  cluster_quantile: 0.8          # alternate cores: scenarios where a team's skater points are in its top 20%
  failure_quantile: 0.2          # priors wrong: scenarios where the chalk team's skater points are in its bottom 20%
  stress_sleeve_max: 0.10        # at most this share of entries from the priors-wrong family
  per_goalie: 2                  # Classic: central-objective candidates forced to hold each usable goalie (B36), on top
  # The goalie term (C20, [BEN] flag 54; experiment docs/experiments/goalie_leverage_2026-10-09.md): every goalie row of every
  # discovery job gains ceiling_weight * (q90 - mean) + leverage_weight * (top_share - own) points (portfolio.goalie_term_points).
  # Hand-set by arithmetic, labeled PRIOR, never fitted. SHIPS OFF; turning it on needs Ben after a real-cache run (B102).
  goalie_term:
    enabled: false
    ceiling_quantile: 0.9        # q90: the goalie's 90th percentile of points over the design scenarios
    ceiling_weight: 0.25         # a quarter of the gap between that and his mean
    leverage_weight: 10.0        # one point for each 10 percentage points of top-goalie share above his field ownership

# Selection (build/portfolio.select): candidates are screened per contest to the best
# max(screen_min, screen_per_entry x its entries) by field-only family utility plus each discovery
# family's best screen_per_family (coverage); the five knobs run on `threads` threads (the result
# does not depend on the thread count; each knob gets memory_cap_mb / threads).
selection:
  screen_min: 40
  screen_per_entry: 2
  screen_per_family: 3
  screen_per_goalie: 2           # each goalie's best kept too, so the goalie cap has choices (B36)
  threads: 5

# Scenario objectives (build/objectives.py)
objectives:
  top_pct: 0.01                  # large GPP tail region: the top 1% of the field size
  max_distinct: 5000             # at most this many distinct field lineups per contest
  sampled_max_opponents: 1000    # fewer opponents than this: draw the actual opponents per scenario
  memory_cap_mb: 384             # per-chunk working memory for payout evaluation

# GPP field growth (build/scenario_pass._grow_fields): a GPP's upper tail needs about as many
# distinct field lineups as opponents, so large_gpp and small_field fields are grown to
# min(target, opponents) draws with the provisional field's behaviors (models.field.sample_parallel).
# mip_rel_gap loosens each field draw's MILP (measured 2026-09-29 on the real Classic pool: 12.8 ms
# per draw on 8 threads at 0.5% against 17.4 ms at the default gap; 358 of 400 draws identical).
# sampler fast: Classic uses the vectorized sampler (models/field_fast.py: the same draws' objectives,
# about 1 ms per draw; on the real 2026-09-29 pool it matched the MILP's lineup in 51% to 100% of
# draws by behavior with a mean value gap of 0.00% to 0.45%, every lineup legal); Showdown and any
# non-compact pool use the threaded MILP (models.field.sample_parallel) with mip_rel_gap below.
field_growth:
  families: [large_gpp, small_field]
  sampler: fast
  target: 5000
  mip_rel_gap: 0.005
  workers: 8
  sub_size: 50
  time_limit_s: 150

# Scenario counts for the full run (sim purposes: design for discovery, selection for choosing,
# referee for the reported figures; separate seed streams, config/sim.yaml).
scenarios:
  design: 5000
  selection: 20000
  referee: 20000
